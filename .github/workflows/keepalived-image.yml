# The vip module's keepalived, from Alpine's packages. Pushed to GHCR as
# ghcr.io/<owner>/keepalived:<TAG> when its files change on main; a pull request only builds it.
# Bump TAG with any change here.
name: keepalived image

on:
  push:
    branches: [main]
    paths: ['images/keepalived/**', '.github/workflows/keepalived-image.yml']
  pull_request:
    paths: ['images/keepalived/**', '.github/workflows/keepalived-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAG: 2.3-kiwi1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 for the boards (Odroid, Banana Pi, Pi)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/keepalived
          file: images/keepalived/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/keepalived:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
