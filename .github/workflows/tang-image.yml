# The tang module's Tang server, from Fedora's packages. Pushed to GHCR as
# ghcr.io/<owner>/tang:<TAG> when its files change on main; a pull request only builds it.
# Bump TAG with any change here.
name: tang image

on:
  push:
    branches: [main]
    paths: ['images/tang/**', '.github/workflows/tang-image.yml']
  pull_request:
    paths: ['images/tang/**', '.github/workflows/tang-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAG: 15-kiwi1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/tang
          file: images/tang/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/tang:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
