# The xmpp module's ejabberd: the project's image plus ImageMagick, fonts and openssl. Pushed to
# GHCR as ghcr.io/<owner>/ejabberd:<TAG> when its files change on main; a pull request only
# builds it. Bump TAG with any change here.
name: ejabberd image

on:
  push:
    branches: [main]
    paths: ['images/ejabberd/**', '.github/workflows/ejabberd-image.yml']
  pull_request:
    paths: ['images/ejabberd/**', '.github/workflows/ejabberd-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAG: 26.09-kiwi1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 for the boards (Odroid, Banana Pi, Pi)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/ejabberd
          file: images/ejabberd/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/ejabberd:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
