# The nostr-relay module's strfry: release 1.1.3 with images/strfry/auth.patch, and
# Python for the write policy. Pushed to GHCR as ghcr.io/<owner>/strfry:<TAG> when its
# files change on main; a pull request only builds it. Bump TAG with any change here.
name: strfry image

on:
  push:
    branches: [main]
    paths: ['images/strfry/**', '.github/workflows/strfry-image.yml']
  pull_request:
    paths: ['images/strfry/**', '.github/workflows/strfry-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAG: 1.1.3-kiwi2

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 for the boards (Odroid, Banana Pi, Pi)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/strfry
          file: images/strfry/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/strfry:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
