schema_version: "1.0"

module:
  name: turn
  title: TURN server (coturn)
  version: 1.0.0
  description: "coturn on a master's public address: a hub's calls get through where two networks allow no direct path (two phones on mobile data, a strict firewall). It passes the browsers' encrypted media on and cannot hear them; a hub on the same host names it to its pages by itself"
  category: network
  node_types: [master]

dependencies:
  required: []
  optional: [vpn-server, hub]

network:
  # in the host's own network: it answers on the host's address and relays from it (a range of UDP ports),
  # past the WireGuard server's double hop, which is for the mesh's own traffic
  listen_ports: ["{{ port }}/udp", "{{ port }}/tcp", "{{ relay_ports }}/udp"]
  needs_vpn_dnat: false
  open_ports: ["{{ port }}/udp", "{{ port }}/tcp", "{{ relay_ports }}/udp"]

firewall:
  # coturn refuses to relay into the host's own networks itself (denied-peer-ip in turnserver.conf)
  scope: self
  rules: []

templates:
  compose: docker-compose.yml.j2
  turnserver_conf: turnserver.conf.j2

outputs:
  # world-readable: coturn runs as nobody. The login in it is no secret from the hub's visitors: their pages are given it
  turnserver_conf: { path: "{{ container_prefix }}-turn/turnserver.conf", mode: 0644 }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-turn", type: dir, required: true }

derived:
  # the name the browsers use: this setting, else the master's public endpoint (vpn-server's wg_host), else the host
  turn_host: "{{ turn_domain or (module_config.get('vpn-server') or {}).get('wg_host') or hostname }}"
  # the stack's own network (172.64.0.0/24 by default, which is no private range): coturn must not relay into it either
  stack_range: "{% set ip, plen = docker_subnet.split('/') %}{% set o = ip.split('.') | map('int') | list %}{% set n = ((o[0] * 256 + o[1]) * 256 + o[2]) * 256 + o[3] %}{% set m = n + 2 ** (32 - plen | int) - 1 %}{{ n // 16777216 }}.{{ n // 65536 % 256 }}.{{ n // 256 % 256 }}.{{ n % 256 }}-{{ m // 16777216 }}.{{ m // 65536 % 256 }}.{{ m // 256 % 256 }}.{{ m % 256 }}"
  relay_min: "{{ (relay_ports.split('-')[0] | int) if '-' in relay_ports else 0 }}"
  relay_max: "{{ (relay_ports.split('-')[1] | int) if '-' in relay_ports else 0 }}"

validate:
  - { when: "relay_min | int < 1024 or relay_max | int > 65535 or relay_max | int <= relay_min | int", error: "turn.relay_ports: a range of ports, e.g. 49160-49200, above 1023" }
  - { when: "relay_max | int - relay_min | int > 2000", error: "turn.relay_ports: 2000 ports at most (each call uses one or two)" }
  - { when: "port | int < 1 or port | int > 65535", error: "turn.port: a port" }
  - { when: "relay_min | int <= port | int <= relay_max | int", error: "turn.port is inside turn.relay_ports" }

urls:
  - "TURN for the hub's calls: turn:{{ turn_host }}:{{ port }} (user {{ username }})"

settings:
  - key: turn_domain
    label: Name
    help: "The name the browsers reach this server under (turn:<name>). Empty: the WireGuard server's public endpoint (wg_host), which points at this machine already. It needs a public DNS record, as a public hub's name does."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: external_ip
    label: Public address behind NAT
    help: "This machine's public IPv4 address when it sits behind a router that forwards the ports to it. Empty: the address on its own interface, as on a rented server."
    default: ""
    pattern: '([0-9]{1,3}\.){3}[0-9]{1,3}|'
  - key: port
    type: int
    label: Port
    help: "UDP and TCP. 3478 is TURN's own; a browser behind a firewall that allows little else may still reach 443, which on a master the reverse proxy holds."
    default: 3478
  - key: relay_ports
    label: Relay ports (UDP)
    help: "The ports the server relays calls through: one or two per call. They must reach this machine from the internet, as the port above does."
    default: "49160-49200"
    pattern: '[0-9]+-[0-9]+'
  - key: username
    label: Login name
    help: "The login the hub's pages use. It is in every page of the hub, so it is a login for this server alone."
    default: kiwi
    pattern: '[A-Za-z0-9._-]+'
  - key: password
    type: secret
    generate: true
    label: Login password
    help: "Empty: generated from the fleet's seed. The hub's pages are given it; a TURN server only relays for those who have it."
  - key: user_quota
    type: int
    group: Advanced
    label: Calls per login at once
    help: "Sessions one login may have at the same time (a call between two is two). Everyone uses the one login, so this is the hub's limit too."
    default: 40
  - key: image
    group: Advanced
    label: Image
    default: docker.io/coturn/coturn:4.18.0
