# A hub on a node: a nostr relay and a hub built on kiwi-framework (Armory, or a
# fork of it), both behind the node's nginx. The hub's data stays at home; the
# master only routes. As it comes this is a private hub: its relay is reachable
# through the mesh only, the hub's relays are fixed, and its pages wait while
# the relay is away. A public name for it comes in through the master
# (reverse-proxy: { public: true } and hub_domain / relay_domain outside the
# fleet's domain), which passes the connection on without reading it.
# Render:
#   kiwi-modules render examples/hub.yaml -o hub.bundle
name: sh3
domain: home
target: ucore
timezone: Europe/Berlin
admin: { user: core }
role: node
node:
  modules: [vpn-client, reverse-proxy, nostr-relay, hub]
  nostr-relay:
    relay_name: Acme relay
    relay_contact: admin@acme.example
  hub:
    image: ghcr.io/derlocke-ng/armory:latest
    # a semi-public hub: the chat (Armory mounts it as uplink) on public relays, so the
    # people inside talk to outsiders there; everything else stays on this relay
    public_relays: [wss://nos.lol, wss://relay.damus.io]
    public_mounts: [uplink]
  reverse-proxy:
    tls_fullchain: secrets/sh3-fullchain.pem
    tls_privkey: secrets/sh3-privkey.pem
dns_records:
  - [10.8.0.1, gate.home]
  - [10.8.0.25, sh3.home]
  - [10.8.0.25, relay.sh3.home]
  - [10.8.0.25, hub.sh3.home]
master_ip: 10.8.0.1
ca_cert: ca.pem
seed: secrets/seed
