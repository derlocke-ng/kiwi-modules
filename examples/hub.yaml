# A hub node: a nostr relay and a hub built on kiwi-framework (Armory, or a
# fork of it), both behind nginx, behind the VPN client. As it comes this is
# a private hub: its relay is reachable through the mesh only, the hub's
# relays are fixed, and its pages wait while the relay is away. Render:
#   kiwi-modules render examples/hub.yaml -o hub.bundle
name: hub1
domain: home
target: ucore
timezone: Europe/Berlin
admin: { user: core }
role: node
node:
  preset: hub
  vpn_ip: 10.8.0.30
  nostr-relay:
    relay_name: Acme relay
    relay_contact: admin@acme.example
  hub:
    image: ghcr.io/derlocke-ng/armory:latest
    # a semi-public hub: the chat (Armory mounts it as uplink) on public relays, so the
    # people inside talk to outsiders there; everything else stays on the node's relay
    public_relays: [wss://nos.lol, wss://relay.damus.io]
    public_mounts: [uplink]
  reverse-proxy:
    tls_fullchain: secrets/hub1-fullchain.pem
    tls_privkey: secrets/hub1-privkey.pem
dns_records:
  - [10.8.0.1, gate.home]
  - [10.8.0.30, hub1.home]
  - [10.8.0.30, hub.hub1.home]
  - [10.8.0.30, relay.hub1.home]
master_ip: 10.8.0.1
ca_cert: ca.pem
seed: secrets/seed
